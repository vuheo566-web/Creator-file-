name: Build File Aim Creator APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v4

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/fileaimcreator/app

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "FileAimCreator"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.6.1" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.fileaimcreator.app"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.fileaimcreator.app"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("androidx.activity:activity-ktx:1.10.0")
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <application
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:label="File Aim Creator"
                  android:allowBackup="false">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>

                  </activity>
              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/fileaimcreator/app/MainActivity.kt <<'EOF'
          package com.fileaimcreator.app

          import android.app.Activity
          import android.os.Bundle
          import android.graphics.Color
          import android.view.Gravity
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val root = LinearLayout(this)
                  root.orientation = LinearLayout.VERTICAL
                  root.gravity = Gravity.CENTER
                  root.setPadding(32, 32, 32, 32)
                  root.setBackgroundColor(Color.rgb(10, 14, 22))

                  val title = TextView(this)
                  title.text = "FILE AIM CREATOR"
                  title.textSize = 28f
                  title.setTextColor(Color.CYAN)
                  title.gravity = Gravity.CENTER

                  val sub = TextView(this)
                  sub.text = "\nCreator APK\n\nPREMIUM-938448"
                  sub.textSize = 18f
                  sub.setTextColor(Color.WHITE)
                  sub.gravity = Gravity.CENTER

                  root.addView(title)
                  root.addView(sub)

                  setContentView(root)
              }
          }
          EOF

      - name: Build APK
        run: |
          gradle --no-daemon --stacktrace assembleDebug

      - name: Check APK
        run: |
          test -f app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FileAimCreator-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
